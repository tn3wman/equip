name: Verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Infisical scanner
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            https://github.com/Infisical/cli/releases/download/v0.43.137/cli_0.43.137_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/infisical.tar.gz"
          echo "308a90c7f9c307cb9c348d352a797a3a63b02e1a7836adbe8afddfd75c855531  $RUNNER_TEMP/infisical.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/infisical.tar.gz" -C "$RUNNER_TEMP" infisical
      - name: Reject credentials in any fetched branch or historical commit
        run: >-
          "$RUNNER_TEMP/infisical" scan --telemetry=false --silent --redact --no-color
          --config "$GITHUB_WORKSPACE/.infisical-scan.toml"
          --log-opts='--all --full-history'
          --report-path "$RUNNER_TEMP/equip-secret-scan.json"

  native-release:
    name: Native release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:cli
      - name: Test native install, update, and device authorization
        run: npx tsx --test tests/platform-runtime.test.ts tests/cli-update-security.test.ts tests/cli-live.test.ts tests/cli-worker-live.test.ts

  cli-release-version:
    name: Check CLI release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/cli-release-version.test.ts
      # Compare against what the release branch last shipped: the PR base, or the
      # previous head of preview/main. A feature-branch push's previous head may
      # already carry this branch's version bump, so those pushes rely on the PR run.
      - name: Require a new version for CLI bundle changes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/preview' || github.ref == 'refs/heads/main'))
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:cli-release -- "$BASE_SHA"
